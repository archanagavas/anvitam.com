[build]
  command = "npm run build"
  publish = "dist"
  functions = "api"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# High-Performance Caching & Security Headers
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Dynamic SEO & Crawlability Endpoints
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/seo?action=sitemap"
  status = 200

[[redirects]]
  from = "/llms.txt"
  to = "/.netlify/functions/seo?action=llms"
  status = 200

[[redirects]]
  from = "/llms-full.txt"
  to = "/.netlify/functions/seo?action=llms-full"
  status = 200

[[redirects]]
  from = "/api/indexnow"
  to = "/.netlify/functions/seo?action=indexnow"
  status = 200

# Admin API
[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin?path=:splat"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

