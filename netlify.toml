[build]
  command = "npm run build"
  publish = "dist"
  functions = "api"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/seo?action=sitemap"
  status = 200

[[redirects]]
  from = "/llms.txt"
  to = "/.netlify/functions/seo?action=llms"
  status = 200

[[redirects]]
  from = "/llms-full.txt"
  to = "/.netlify/functions/seo?action=llms-full"
  status = 200

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin?path=:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
