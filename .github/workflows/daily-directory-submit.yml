name: Daily Backlink & Directory Drip Agent

on:
  schedule:
    # Runs daily at 06:00 UTC (11:30 AM IST) - 1 hour after blog generator
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backlink-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Directory Drip Submission (1-3 Free Targets / Day)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          npx tsx scripts/auto-directory-submit.ts --count 2

      - name: Commit & Push Updated Directory Submission Queue
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/backlinks/directory_targets.json
          git commit -m "chore(seo): autonomous directory drip submission [skip ci]" || echo "No changes to commit"
          git push origin main || true
