name: Daily HNI Client & Backlink Outreach Agent

on:
  schedule:
    # Runs daily at 07:00 UTC (12:30 PM IST)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  outreach-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Daily Client Outreach (1-2 HNI targets / day)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          npx tsx scripts/run-daily-outreach.ts --send 1

      - name: Commit & Push Updated Outreach Pipeline
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/outreach/client_leads.json
          git commit -m "chore(growth): autonomous client outreach drip [skip ci]" || echo "No changes to commit"
          git push origin main || true
