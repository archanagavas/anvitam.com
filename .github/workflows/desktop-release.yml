name: Release RachnaCAD Desktop Standalone (Mac, Windows, Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-13'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build Desktop Application via Tauri 2.0
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'RachnaCAD Desktop v__VERSION__'
          releaseBody: |
            ## RachnaCAD Standalone Architectural CAD & 3D Parametric BIM Suite
            
            ### Cross-Platform Native Installers:
            - **Windows (10/11):** `.exe` (NSIS Installer) & `.msi` 64-bit
            - **macOS:** `.dmg` (Universal Apple Silicon M-Series & Intel)
            - **Linux:** `.deb` (Debian/Ubuntu) & `.AppImage` (Portable)
            
            ### Key Capabilities:
            - **100% Offline Capable:** Zero cloud dependency, runs private on your computer.
            - **Dual Split CAD/BIM:** AutoCAD 2D drafting synced real-time with WebGPU 3D parametric BIM.
            - **Built-in Local GPU AI:** Multi-model Qwen-2.5 Coder & Llama 3.2 on local hardware.
            - **Format Exchange:** Native .DXF (AutoCAD), .IFC (Archicad/Revit BIM), and .RCAD.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
