name: Autonomous Daily Blog Agent (Archana Voice)

on:
  schedule:
    # Runs daily at 05:00 AM UTC (10:30 AM IST)
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions anytime

jobs:
  write-blogs:
    name: Generate 3-4 High-Intent SEO Drafts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Daily Blog Engine
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          npx tsx scripts/run-daily-blogs.ts --count 3
