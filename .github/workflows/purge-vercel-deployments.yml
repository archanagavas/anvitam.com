name: Purge Old Vercel Deployments (Save Free Storage)

on:
  schedule:
    # Runs every 6 days at midnight UTC
    - cron: '0 0 */6 * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

jobs:
  purge:
    name: Purge Inactive Deployments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Storage Purge
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_NAME: 'anvitam'
        run: |
          python scripts/purge_vercel_deployments.py --keep 3
