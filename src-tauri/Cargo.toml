[package]
name = "rachnacad"
version = "1.0.0"
description = "RachnaCAD | 21st-Century 2D/3D BIM & Architectural CAD Suite by Anvitam"
authors = ["Anvitam Architecture & AI Team <archana@anvitam.com>"]
edition = "2021"
license = "Proprietary"

[lib]
name = "rachnacad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-updater = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
